<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t13 d13">
  <title id="t13">SDD 五阶段流程全景图</title>
  <desc id="d13">SDD 五阶段信息精炼管道：Constitution（"项目信仰什么？"产出 CLAUDE.md）→ Specify（"构建什么？"产出 Spec）→ Plan（"怎么实现？"产出 Architecture）→ Tasks（"做哪些事？"产出 Task List）→ Implement（"执行验证"产出 Working Code）。Constitution 贯穿所有阶段作为不变量。</desc>
  <style>
    .label { fill: #1a1a1a; font-weight: 600; text-anchor: middle; font-size: 13px; }
    .sub { fill: #5a5a5a; font-size: 10px; text-anchor: middle; }
    .q { fill: #fff; font-size: 10px; text-anchor: middle; }
    .tag { fill: #fff; font-weight: 700; font-size: 13px; text-anchor: middle; }
    .arrow { stroke: #1a2233; stroke-width: 2; fill: none; }
    .arrow-const { stroke: #2563eb; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; }
  </style>
  <defs>
    <marker id="a13" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
    <marker id="a13b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="340" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">SDD 五阶段信息精炼管道</text>

  <!-- Phase 1: Constitution -->
  <rect x="30" y="60" width="140" height="90" rx="8" fill="#2563eb"/>
  <text x="100" y="88" class="tag">Constitution</text>
  <text x="100" y="108" class="q">"项目信仰什么？"</text>
  <text x="100" y="126" class="q">→ CLAUDE.md</text>

  <line x1="170" y1="105" x2="210" y2="105" class="arrow" marker-end="url(#a13)"/>

  <!-- Phase 2: Specify -->
  <rect x="210" y="60" width="140" height="90" rx="8" fill="#4f97ff"/>
  <text x="280" y="88" class="tag">Specify</text>
  <text x="280" y="108" class="q">"构建什么？"</text>
  <text x="280" y="126" class="q">→ Spec</text>

  <line x1="350" y1="105" x2="390" y2="105" class="arrow" marker-end="url(#a13)"/>

  <!-- Phase 3: Plan -->
  <rect x="390" y="60" width="140" height="90" rx="8" fill="#7ab2ff"/>
  <text x="460" y="88" class="tag">Plan</text>
  <text x="460" y="108" class="q">"怎么实现？"</text>
  <text x="460" y="126" class="q">→ Architecture</text>

  <line x1="530" y1="105" x2="570" y2="105" class="arrow" marker-end="url(#a13)"/>

  <!-- Phase 4: Tasks -->
  <rect x="570" y="60" width="140" height="90" rx="8" fill="#a16207"/>
  <text x="640" y="88" class="tag">Tasks</text>
  <text x="640" y="108" class="q">"做哪些事？"</text>
  <text x="640" y="126" class="q">→ Task List</text>

  <line x1="710" y1="105" x2="750" y2="105" class="arrow" marker-end="url(#a13)"/>

  <!-- Phase 5: Implement -->
  <rect x="750" y="60" width="110" height="90" rx="8" fill="#0a7c2e"/>
  <text x="805" y="88" class="tag">Implement</text>
  <text x="805" y="108" class="q">"执行验证"</text>
  <text x="805" y="126" class="q">→ Code</text>

  <!-- Constitution dashed line spanning all -->
  <line x1="100" y1="150" x2="100" y2="200" class="arrow-const"/>
  <line x1="100" y1="200" x2="805" y2="200" class="arrow-const" marker-end="url(#a13b)"/>
  <text x="440" y="218" text-anchor="middle" fill="#2563eb" font-size="11" font-style="italic">Constitution 贯穿全程——约束所有阶段的不变量</text>

  <!-- Info flow -->
  <rect x="120" y="245" width="640" height="50" rx="6" fill="#fff" stroke="#d0d3d8"/>
  <text x="440" y="266" text-anchor="middle" class="label" font-size="12">信息封装：每阶段只依赖上一阶段的输出，不需要追溯到源头</text>
  <text x="440" y="284" text-anchor="middle" class="sub">Spec → Plan input · Plan → Tasks input · Tasks → Implement input</text>

  <!-- Time allocation -->
  <text x="440" y="322" text-anchor="middle" class="sub">时间分配：60% 规划（Phase 1-4） · 40% 实现（Phase 5）</text>
</svg>
