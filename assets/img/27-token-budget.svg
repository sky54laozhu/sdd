<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t27 d27">
  <title id="t27">Context Window Token 预算分配</title>
  <desc id="d27">展示 200K token 的 Context Window 中各部分的分配：System prompt + CLAUDE.md (~2K)、Conversation history (~30K)、Spec files (~6K)、Plan file (~2K)、Code files (~15K)、Tool call results (~20K)、Agent thinking (~40K)。已用约 115K，剩余约 85K，安全区在 80% (160K) 处结束，最后 20% 为危险区。</desc>
  <style>
    .label { fill: #1a1a1a; font-weight: 500; font-size: 12px; }
    .val { fill: #1a1a1a; font-weight: 600; font-size: 12px; text-anchor: end; }
    .sub { fill: #5a5a5a; font-size: 11px; text-anchor: middle; }
    .h { font-weight: 600; fill: #fff; text-anchor: middle; font-size: 12px; }
  </style>

  <rect x="0" y="0" width="880" height="400" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">Context Window Token 预算 (~200K)</text>

  <!-- Table header -->
  <rect x="40" y="50" width="800" height="30" fill="#1a2233"/>
  <text x="240" y="70" class="h">项目</text>
  <text x="650" y="70" class="h">Token 估算</text>
  <text x="790" y="70" class="h">占比</text>

  <!-- Row 1 -->
  <rect x="40" y="80" width="800" height="30" fill="#f6f7f9"/>
  <text x="60" y="100" class="label">System prompt + CLAUDE.md</text>
  <text x="680" y="100" class="val">~2,000</text>
  <rect x="720" y="87" width="8" height="16" fill="#2563eb"/>
  <text x="790" y="100" fill="#5a5a5a" font-size="11" text-anchor="middle">1%</text>

  <!-- Row 2 -->
  <rect x="40" y="110" width="800" height="30" fill="#fff"/>
  <text x="60" y="130" class="label">Conversation history (30 turns)</text>
  <text x="680" y="130" class="val">~30,000</text>
  <rect x="720" y="117" width="60" height="16" fill="#4f97ff"/>
  <text x="790" y="130" fill="#5a5a5a" font-size="11" text-anchor="middle">15%</text>

  <!-- Row 3 -->
  <rect x="40" y="140" width="800" height="30" fill="#f6f7f9"/>
  <text x="60" y="160" class="label">Spec files (2-3 specs loaded)</text>
  <text x="680" y="160" class="val">~6,000</text>
  <rect x="720" y="147" width="12" height="16" fill="#4f97ff"/>
  <text x="790" y="160" fill="#5a5a5a" font-size="11" text-anchor="middle">3%</text>

  <!-- Row 4 -->
  <rect x="40" y="170" width="800" height="30" fill="#fff"/>
  <text x="60" y="190" class="label">Plan file</text>
  <text x="680" y="190" class="val">~2,000</text>
  <rect x="720" y="177" width="4" height="16" fill="#4f97ff"/>
  <text x="790" y="190" fill="#5a5a5a" font-size="11" text-anchor="middle">1%</text>

  <!-- Row 5 -->
  <rect x="40" y="200" width="800" height="30" fill="#f6f7f9"/>
  <text x="60" y="220" class="label">Code files read (5-8 files)</text>
  <text x="680" y="220" class="val">~15,000</text>
  <rect x="720" y="207" width="30" height="16" fill="#4f97ff"/>
  <text x="790" y="220" fill="#5a5a5a" font-size="11" text-anchor="middle">8%</text>

  <!-- Row 6 -->
  <rect x="40" y="230" width="800" height="30" fill="#fff"/>
  <text x="60" y="250" class="label">Tool call results</text>
  <text x="680" y="250" class="val">~20,000</text>
  <rect x="720" y="237" width="40" height="16" fill="#a16207"/>
  <text x="790" y="250" fill="#5a5a5a" font-size="11" text-anchor="middle">10%</text>

  <!-- Row 7 -->
  <rect x="40" y="260" width="800" height="30" fill="#f6f7f9"/>
  <text x="60" y="280" class="label">Agent thinking / reasoning</text>
  <text x="680" y="280" class="val">~40,000</text>
  <rect x="720" y="267" width="80" height="16" fill="#a16207"/>
  <text x="790" y="280" fill="#5a5a5a" font-size="11" text-anchor="middle">20%</text>

  <!-- Totals -->
  <rect x="40" y="295" width="800" height="2" fill="#1a2233"/>
  <rect x="40" y="300" width="800" height="30" fill="#d1fae5"/>
  <text x="60" y="320" class="label" font-weight="700">已用 (Used)</text>
  <text x="680" y="320" class="val" font-weight="700" fill="#047857">~115,000</text>
  <text x="790" y="320" fill="#047857" font-size="11" text-anchor="middle" font-weight="600">58%</text>

  <rect x="40" y="330" width="800" height="30" fill="#dbeafe"/>
  <text x="60" y="350" class="label">剩余 (Remaining)</text>
  <text x="680" y="350" class="val" fill="#2563eb">~85,000</text>
  <text x="790" y="350" fill="#2563eb" font-size="11" text-anchor="middle">42%</text>

  <rect x="40" y="360" width="800" height="30" fill="#fee2e2"/>
  <text x="60" y="380" class="label" fill="#b91c1c" font-weight="600">DANGER: 最后 20%（&gt;160K）</text>
  <text x="680" y="380" class="val" fill="#b91c1c">~40,000</text>
  <text x="790" y="380" fill="#b91c1c" font-size="11" text-anchor="middle" font-weight="600">20%</text>
</svg>
