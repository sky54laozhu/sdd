<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 280" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t01 d01">
  <title id="t01">SDD 前后对比：传统开发 vs SDD 开发流程</title>
  <desc id="d01">上排展示传统开发：模糊想法→边写边想→代码（可能正确也可能不正确）。下排展示 SDD：模糊想法→结构化 Spec→审核→代码生成→验证。关键区别在于"审核"步骤的引入。</desc>
  <style>
    .label { fill: #1a1a1a; font-weight: 500; text-anchor: middle; }
    .sub { fill: #5a5a5a; font-size: 11px; text-anchor: middle; }
    .tag { fill: #fff; font-weight: 600; font-size: 12px; text-anchor: middle; }
    .arrow { stroke: #1a2233; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a01" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="280" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="440" y="30" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">SDD 前后对比</text>

  <!-- Row 1: Traditional -->
  <rect x="30" y="52" width="60" height="24" rx="4" fill="#b71c1c"/>
  <text x="60" y="68" class="tag">Before</text>

  <rect x="110" y="70" width="140" height="50" rx="8" fill="#fee2e2" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="180" y="92" class="label">模糊想法</text>
  <text x="180" y="108" class="sub">Vague Idea</text>

  <line x1="250" y1="95" x2="310" y2="95" class="arrow" marker-end="url(#a01)"/>

  <rect x="310" y="70" width="140" height="50" rx="8" fill="#fee2e2" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="380" y="92" class="label">边写边想</text>
  <text x="380" y="108" class="sub">Code &amp; Pray</text>

  <line x1="450" y1="95" x2="510" y2="95" class="arrow" marker-end="url(#a01)"/>

  <rect x="510" y="70" width="180" height="50" rx="8" fill="#fee2e2" stroke="#b71c1c" stroke-width="1.5"/>
  <text x="600" y="92" class="label">代码</text>
  <text x="600" y="108" class="sub">可能正确也可能不正确</text>

  <!-- Row 2: SDD -->
  <rect x="30" y="152" width="60" height="24" rx="4" fill="#0a7c2e"/>
  <text x="60" y="168" class="tag">After</text>

  <rect x="110" y="170" width="110" height="50" rx="8" fill="#d1fae5" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="165" y="192" class="label">模糊想法</text>
  <text x="165" y="208" class="sub">Vague Idea</text>

  <line x1="220" y1="195" x2="250" y2="195" class="arrow" marker-end="url(#a01)"/>

  <rect x="250" y="170" width="110" height="50" rx="8" fill="#d1fae5" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="305" y="192" class="label">结构化 Spec</text>
  <text x="305" y="208" class="sub">Specification</text>

  <line x1="360" y1="195" x2="390" y2="195" class="arrow" marker-end="url(#a01)"/>

  <rect x="390" y="170" width="90" height="50" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="435" y="192" class="label" font-weight="700">审核</text>
  <text x="435" y="208" class="sub" fill="#a16207">Review ★</text>

  <line x1="480" y1="195" x2="510" y2="195" class="arrow" marker-end="url(#a01)"/>

  <rect x="510" y="170" width="110" height="50" rx="8" fill="#d1fae5" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="565" y="192" class="label">代码生成</text>
  <text x="565" y="208" class="sub">Generate</text>

  <line x1="620" y1="195" x2="650" y2="195" class="arrow" marker-end="url(#a01)"/>

  <rect x="650" y="170" width="110" height="50" rx="8" fill="#d1fae5" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="705" y="192" class="label">验证</text>
  <text x="705" y="208" class="sub">Verify</text>

  <!-- Bottom note -->
  <text x="440" y="260" text-anchor="middle" class="sub">关键区别：Spec 是可被审核的（reviewable），"脑中的想法"不是</text>
</svg>
