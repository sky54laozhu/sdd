<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t17 d17">
  <title id="t17">SDD 10 个陷阱的关系图——膨胀链 + 精度链</title>
  <desc id="d17">展示 10 个 SDD 陷阱的因果关系。膨胀链（上排红色）：CLAUDE.md 膨胀→上下文耗尽→知行不一→审核疲劳→形式主义。精度链（下排蓝色）：过度规格化⇔规格不足→规格矛盾→规格漂移。模板崇拜连接到形式主义。两条链路的打断方法标注在底部。</desc>
  <style>
    .label { fill: #1a1a1a; font-weight: 600; text-anchor: middle; font-size: 12px; }
    .num { fill: #fff; font-weight: 700; text-anchor: middle; font-size: 11px; }
    .sub { fill: #5a5a5a; font-size: 10px; text-anchor: middle; }
    .arrow { stroke: #1a2233; stroke-width: 2; fill: none; }
    .arrow-bi { stroke: #2563eb; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a17" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
    <marker id="a17b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="480" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">SDD 10 个陷阱的关系图</text>

  <!-- Chain label: 膨胀链 -->
  <rect x="30" y="48" width="100" height="22" rx="4" fill="#b91c1c"/>
  <text x="80" y="63" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">膨胀链</text>

  <!-- #1 Bloat -->
  <rect x="40" y="85" width="130" height="55" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="55" cy="97" r="10" fill="#b91c1c"/>
  <text x="55" y="101" class="num">1</text>
  <text x="110" y="104" class="label" font-size="11">Bloat</text>
  <text x="105" y="128" class="sub">宪法膨胀</text>

  <line x1="170" y1="112" x2="210" y2="112" class="arrow" marker-end="url(#a17)"/>

  <!-- #3 Context Exhaustion -->
  <rect x="210" y="85" width="130" height="55" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="225" cy="97" r="10" fill="#b91c1c"/>
  <text x="225" y="101" class="num">3</text>
  <text x="282" y="104" class="label" font-size="11">Context</text>
  <text x="275" y="128" class="sub">上下文耗尽</text>

  <line x1="340" y1="112" x2="380" y2="112" class="arrow" marker-end="url(#a17)"/>

  <!-- #9 Awareness≠Adherence -->
  <rect x="380" y="85" width="130" height="55" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="395" cy="97" r="10" fill="#b91c1c"/>
  <text x="395" y="101" class="num">9</text>
  <text x="452" y="104" class="label" font-size="10">Awareness≠</text>
  <text x="445" y="128" class="sub">知行不一</text>

  <line x1="510" y1="112" x2="550" y2="112" class="arrow" marker-end="url(#a17)"/>

  <!-- #8 Gate Fatigue -->
  <rect x="550" y="85" width="130" height="55" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="565" cy="97" r="10" fill="#b91c1c"/>
  <text x="565" y="101" class="num">8</text>
  <text x="622" y="104" class="label" font-size="11">Gate Fatigue</text>
  <text x="615" y="128" class="sub">审核疲劳</text>

  <line x1="680" y1="112" x2="720" y2="112" class="arrow" marker-end="url(#a17)"/>

  <!-- #7 Cargo-Cult -->
  <rect x="720" y="85" width="130" height="55" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <circle cx="735" cy="97" r="10" fill="#b91c1c"/>
  <text x="735" y="101" class="num">7</text>
  <text x="792" y="104" class="label" font-size="11">Cargo-Cult</text>
  <text x="785" y="128" class="sub">形式主义</text>

  <!-- Chain label: 精度链 -->
  <rect x="30" y="175" width="100" height="22" rx="4" fill="#2563eb"/>
  <text x="80" y="190" fill="#fff" font-size="11" font-weight="600" text-anchor="middle">精度链</text>

  <!-- #4 Over-Spec -->
  <rect x="60" y="215" width="140" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="75" cy="227" r="10" fill="#2563eb"/>
  <text x="75" y="231" class="num">4</text>
  <text x="138" y="234" class="label" font-size="11">Over-Spec</text>
  <text x="130" y="258" class="sub">过度规格化</text>

  <!-- #5 Under-Spec (bi-directional with Over-Spec) -->
  <rect x="280" y="215" width="140" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="295" cy="227" r="10" fill="#2563eb"/>
  <text x="295" y="231" class="num">5</text>
  <text x="358" y="234" class="label" font-size="11">Under-Spec</text>
  <text x="350" y="258" class="sub">规格不足</text>

  <line x1="200" y1="238" x2="280" y2="238" class="arrow-bi" marker-end="url(#a17b)"/>
  <line x1="280" y1="248" x2="200" y2="248" class="arrow-bi" marker-end="url(#a17b)"/>

  <!-- Both converge to #6 Contradictions -->
  <line x1="130" y1="270" x2="490" y2="300" class="arrow" marker-end="url(#a17)"/>
  <line x1="350" y1="270" x2="490" y2="300" class="arrow" marker-end="url(#a17)"/>

  <!-- #6 Contradictions -->
  <rect x="460" y="290" width="160" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="475" cy="302" r="10" fill="#2563eb"/>
  <text x="475" y="306" class="num">6</text>
  <text x="548" y="309" class="label" font-size="11">Contradictions</text>
  <text x="540" y="333" class="sub">规格矛盾</text>

  <line x1="620" y1="318" x2="680" y2="318" class="arrow" marker-end="url(#a17)"/>

  <!-- #2 Spec Drift -->
  <rect x="680" y="290" width="140" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="695" cy="302" r="10" fill="#2563eb"/>
  <text x="695" y="306" class="num">2</text>
  <text x="758" y="309" class="label" font-size="11">Spec Drift</text>
  <text x="750" y="333" class="sub">规格漂移</text>

  <!-- #10 Template Worship → Cargo-Cult -->
  <rect x="60" y="375" width="160" height="50" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="75" cy="390" r="10" fill="#6b7280"/>
  <text x="75" y="394" class="num">10</text>
  <text x="148" y="396" class="label" font-size="11">Template Worship</text>
  <text x="140" y="416" class="sub">模板崇拜</text>

  <path d="M 220 390 Q 470 390 785 140" class="arrow" marker-end="url(#a17)"/>

  <!-- Solution box -->
  <rect x="300" y="388" width="540" height="60" rx="6" fill="#fff" stroke="#d0d3d8"/>
  <text x="570" y="408" text-anchor="middle" fill="#1a2233" font-weight="600" font-size="11">打断膨胀链：保持 CLAUDE.md 精炼 + 用 Hooks 强制执行</text>
  <text x="570" y="428" text-anchor="middle" fill="#1a2233" font-weight="600" font-size="11">打断精度链：EARS Notation + 具体 AC + 自动化合规检查</text>
</svg>
