<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 380" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t08 d08">
  <title id="t08">子代理扇出模式：主会话编排 3 个隔离子代理</title>
  <desc id="d08">Main Session（Orchestrator）发出任务"实现 user auth feature"，扇出到 3 个独立子代理：Agent A（研究者）返回报告，Agent B（实现者）返回代码，Agent C（验证者）返回 PASS/FAIL。子代理之间不直接通信，所有协调由 Orchestrator 负责。</desc>
  <style>
    .label { fill: #1a1a1a; font-weight: 500; text-anchor: middle; }
    .sub { fill: #5a5a5a; font-size: 11px; text-anchor: middle; }
    .tag { fill: #fff; font-weight: 600; font-size: 12px; text-anchor: middle; }
    .arrow { stroke: #1a2233; stroke-width: 2; fill: none; }
    .arrow-ret { stroke: #0a7c2e; stroke-width: 1.5; fill: none; stroke-dasharray: 5 3; }
  </style>
  <defs>
    <marker id="a08" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
    <marker id="a08g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a7c2e"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="380" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">子代理扇出模式（Fan-out）</text>

  <!-- Main Session -->
  <rect x="290" y="50" width="300" height="70" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="440" y="78" class="label" font-weight="700">Main Session (Orchestrator)</text>
  <text x="440" y="98" class="sub">"实现 user auth feature"</text>

  <!-- Fan-out arrows -->
  <line x1="370" y1="120" x2="190" y2="180" class="arrow" marker-end="url(#a08)"/>
  <line x1="440" y1="120" x2="440" y2="180" class="arrow" marker-end="url(#a08)"/>
  <line x1="510" y1="120" x2="690" y2="180" class="arrow" marker-end="url(#a08)"/>

  <!-- Agent A -->
  <rect x="100" y="180" width="180" height="70" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="1.5"/>
  <text x="190" y="208" class="label" font-weight="600">Agent A</text>
  <text x="190" y="228" class="sub">研究者 (Researcher)</text>

  <!-- Agent B -->
  <rect x="350" y="180" width="180" height="70" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="1.5"/>
  <text x="440" y="208" class="label" font-weight="600">Agent B</text>
  <text x="440" y="228" class="sub">实现者 (Implementer)</text>

  <!-- Agent C -->
  <rect x="600" y="180" width="180" height="70" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
  <text x="690" y="208" class="label" font-weight="600">Agent C</text>
  <text x="690" y="228" class="sub">验证者 (Verifier)</text>

  <!-- Return arrows -->
  <line x1="190" y1="250" x2="190" y2="300" class="arrow-ret" marker-end="url(#a08g)"/>
  <line x1="440" y1="250" x2="440" y2="300" class="arrow-ret" marker-end="url(#a08g)"/>
  <line x1="690" y1="250" x2="690" y2="300" class="arrow-ret" marker-end="url(#a08g)"/>

  <!-- Results -->
  <rect x="140" y="300" width="100" height="36" rx="6" fill="#fff" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="190" y="323" class="label" fill="#0a7c2e">报告</text>

  <rect x="390" y="300" width="100" height="36" rx="6" fill="#fff" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="440" y="323" class="label" fill="#0a7c2e">代码</text>

  <rect x="640" y="300" width="100" height="36" rx="6" fill="#fff" stroke="#0a7c2e" stroke-width="1.5"/>
  <text x="690" y="323" class="label" fill="#0a7c2e">PASS/FAIL</text>

  <!-- Note -->
  <text x="440" y="365" text-anchor="middle" class="sub">子代理之间不直接通信——所有协调由 Orchestrator 负责</text>
</svg>
