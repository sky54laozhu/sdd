<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t12 d12">
  <title id="t12">5 种多代理编排模式总览</title>
  <desc id="d12">横向对比 5 种多代理模式：Verifier Agent（对抗验证 Implement→Verify）、Parallel Research（并行探索 Q1/Q2/Q3→Aggregate）、Orchestrator（集中调度 Main→A/B/C）、GAN Generator/Evaluator（迭代对抗 Gen⇄Eval Loop）、Pipeline（链式传递 A→B→C→D 加 Gate）。</desc>
  <style>
    .h { font-weight: 600; fill: #fff; text-anchor: middle; font-size: 12px; }
    .label { fill: #1a1a1a; font-weight: 500; text-anchor: middle; font-size: 12px; }
    .sub { fill: #5a5a5a; font-size: 10px; text-anchor: middle; }
    .mini { fill: #1a1a1a; font-size: 10px; text-anchor: middle; }
    .arrow { stroke: #1a2233; stroke-width: 1.5; fill: none; }
  </style>
  <defs>
    <marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="320" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="440" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">5 种多代理编排模式</text>

  <!-- Pattern 1: Verifier -->
  <rect x="20" y="50" width="156" height="34" rx="4" fill="#1a2233"/>
  <text x="98" y="72" class="h">Verifier Agent</text>
  <text x="98" y="108" class="sub">对抗验证</text>

  <rect x="42" y="125" width="55" height="30" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="70" y="145" class="mini">Implement</text>
  <line x1="70" y1="155" x2="70" y2="175" class="arrow" marker-end="url(#a12)"/>
  <rect x="42" y="175" width="55" height="30" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="70" y="195" class="mini">Verify</text>

  <!-- Pattern 2: Parallel Research -->
  <rect x="196" y="50" width="156" height="34" rx="4" fill="#1a2233"/>
  <text x="274" y="72" class="h">Parallel Research</text>
  <text x="274" y="108" class="sub">并行探索</text>

  <rect x="208" y="125" width="35" height="25" rx="4" fill="#fef3c7" stroke="#a16207"/>
  <text x="226" y="142" class="mini">Q1</text>
  <rect x="256" y="125" width="35" height="25" rx="4" fill="#fef3c7" stroke="#a16207"/>
  <text x="274" y="142" class="mini">Q2</text>
  <rect x="304" y="125" width="35" height="25" rx="4" fill="#fef3c7" stroke="#a16207"/>
  <text x="322" y="142" class="mini">Q3</text>
  <line x1="226" y1="150" x2="274" y2="175" class="arrow" marker-end="url(#a12)"/>
  <line x1="274" y1="150" x2="274" y2="175" class="arrow" marker-end="url(#a12)"/>
  <line x1="322" y1="150" x2="274" y2="175" class="arrow" marker-end="url(#a12)"/>
  <rect x="240" y="175" width="70" height="25" rx="4" fill="#d1fae5" stroke="#047857"/>
  <text x="275" y="192" class="mini">Aggregate</text>

  <!-- Pattern 3: Orchestrator -->
  <rect x="372" y="50" width="156" height="34" rx="4" fill="#1a2233"/>
  <text x="450" y="72" class="h">Orchestrator</text>
  <text x="450" y="108" class="sub">集中调度</text>

  <rect x="425" y="120" width="50" height="25" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="450" y="137" class="mini">Main</text>
  <line x1="433" y1="145" x2="410" y2="175" class="arrow" marker-end="url(#a12)"/>
  <line x1="450" y1="145" x2="450" y2="175" class="arrow" marker-end="url(#a12)"/>
  <line x1="467" y1="145" x2="490" y2="175" class="arrow" marker-end="url(#a12)"/>
  <rect x="393" y="175" width="30" height="25" rx="4" fill="#fef3c7" stroke="#a16207"/>
  <text x="408" y="192" class="mini">A</text>
  <rect x="435" y="175" width="30" height="25" rx="4" fill="#fef3c7" stroke="#a16207"/>
  <text x="450" y="192" class="mini">B</text>
  <rect x="478" y="175" width="30" height="25" rx="4" fill="#fef3c7" stroke="#a16207"/>
  <text x="493" y="192" class="mini">C</text>

  <!-- Pattern 4: GAN -->
  <rect x="548" y="50" width="156" height="34" rx="4" fill="#1a2233"/>
  <text x="626" y="72" class="h">GAN</text>
  <text x="626" y="108" class="sub">迭代对抗</text>

  <rect x="578" y="130" width="50" height="25" rx="4" fill="#d1fae5" stroke="#047857"/>
  <text x="603" y="147" class="mini">Gen</text>
  <rect x="648" y="130" width="50" height="25" rx="4" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="673" y="147" class="mini">Eval</text>
  <path d="M 628 142 L 648 142" class="arrow" marker-end="url(#a12)"/>
  <path d="M 648 148 L 628 148" class="arrow" marker-end="url(#a12)"/>
  <rect x="602" y="175" width="50" height="22" rx="4" fill="#fff" stroke="#1a2233"/>
  <text x="627" y="190" class="mini">Loop</text>

  <!-- Pattern 5: Pipeline -->
  <rect x="724" y="50" width="136" height="34" rx="4" fill="#1a2233"/>
  <text x="792" y="72" class="h">Pipeline</text>
  <text x="792" y="108" class="sub">链式传递</text>

  <rect x="738" y="125" width="30" height="25" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="753" y="142" class="mini">A</text>
  <line x1="768" y1="138" x2="778" y2="138" class="arrow" marker-end="url(#a12)"/>
  <rect x="778" y="125" width="30" height="25" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="793" y="142" class="mini">B</text>
  <line x1="808" y1="138" x2="818" y2="138" class="arrow" marker-end="url(#a12)"/>
  <rect x="818" y="125" width="30" height="25" rx="4" fill="#dbeafe" stroke="#2563eb"/>
  <text x="833" y="142" class="mini">C</text>
  <rect x="748" y="165" width="44" height="18" rx="3" fill="#fef3c7" stroke="#a16207"/>
  <text x="770" y="178" class="mini" font-size="9">Gate</text>
  <rect x="808" y="165" width="44" height="18" rx="3" fill="#fef3c7" stroke="#a16207"/>
  <text x="830" y="178" class="mini" font-size="9">Gate</text>

  <!-- Bottom summary -->
  <rect x="20" y="230" width="840" height="74" rx="6" fill="#fff" stroke="#d0d3d8"/>
  <text x="440" y="252" text-anchor="middle" class="label" fill="#1a2233" font-weight="700">选型速查</text>
  <text x="440" y="272" text-anchor="middle" class="sub">单功能验证 → Verifier · 多角度调研 → Parallel · 多步骤分工 → Orchestrator</text>
  <text x="440" y="290" text-anchor="middle" class="sub">质量迭代 → GAN · 阶段式传递 → Pipeline</text>
</svg>
