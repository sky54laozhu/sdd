<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', Arial, sans-serif" font-size="13" role="img" aria-labelledby="t26 d26">
  <title id="t26">自主循环模式：Simple Loop</title>
  <desc id="d26">Task list 驱动的自主线性循环：Pick Next Task → Implement Task → Run Tests → Mark Complete → 回到 Pick Next Task。退出条件：所有 task 完成或达到最大失败次数。</desc>
  <style>
    .label { fill: #1a1a1a; font-weight: 600; text-anchor: middle; }
    .sub { fill: #5a5a5a; font-size: 11px; text-anchor: middle; }
    .tag { fill: #fff; font-weight: 700; font-size: 12px; text-anchor: middle; }
    .arrow { stroke: #1a2233; stroke-width: 2; fill: none; }
  </style>
  <defs>
    <marker id="a26" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1a2233"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="600" height="360" fill="#fafbfc" stroke="#1a2233" stroke-width="2" rx="4"/>
  <text x="300" y="28" text-anchor="middle" fill="#1a2233" font-size="16" font-weight="600">自主循环模式 · Simple Loop</text>

  <!-- Pick Next Task -->
  <rect x="80" y="60" width="180" height="55" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="170" y="85" class="label">Pick Next Task</text>
  <text x="170" y="103" class="sub">选择下一个任务</text>

  <line x1="260" y1="88" x2="330" y2="88" class="arrow" marker-end="url(#a26)"/>

  <!-- Implement Task -->
  <rect x="330" y="60" width="180" height="55" rx="8" fill="#4f97ff"/>
  <text x="420" y="85" class="tag">Implement Task</text>
  <text x="420" y="103" fill="#fff" font-size="10" text-anchor="middle">执行任务</text>

  <line x1="420" y1="115" x2="420" y2="155" class="arrow" marker-end="url(#a26)"/>

  <!-- Run Tests -->
  <rect x="330" y="155" width="180" height="55" rx="8" fill="#d1fae5" stroke="#047857" stroke-width="2"/>
  <text x="420" y="180" class="label" fill="#047857">Run Tests</text>
  <text x="420" y="198" class="sub">运行测试验证</text>

  <line x1="330" y1="182" x2="260" y2="182" class="arrow" marker-end="url(#a26)"/>

  <!-- Mark Complete -->
  <rect x="80" y="155" width="180" height="55" rx="8" fill="#fef3c7" stroke="#a16207" stroke-width="2"/>
  <text x="170" y="180" class="label">Mark Complete</text>
  <text x="170" y="198" class="sub">标记完成</text>

  <!-- Loop back arrow -->
  <path d="M 170 155 Q 170 135 170 130 Q 170 125 155 125 Q 50 125 50 88 Q 50 60 80 60" class="arrow" marker-end="url(#a26)"/>

  <!-- Exit condition -->
  <rect x="130" y="245" width="340" height="55" rx="8" fill="#fff" stroke="#d0d3d8"/>
  <text x="300" y="265" class="label" font-size="12">Exit Condition</text>
  <text x="300" y="285" class="sub">all tasks complete OR max fails reached</text>

  <!-- Note -->
  <text x="300" y="338" text-anchor="middle" class="sub">最基础的自主模式——Task List 驱动的线性执行</text>
</svg>
